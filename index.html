<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Makes the page scale properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>An Overview of SNES Video Game, Mega Man X2</title>

    <!-- Shared stylesheet for the whole gallery -->
    <link rel="stylesheet" type="text/css" href="MMX2style.css">
</head>

<body>

    <!-- Background theme music. Browsers block autoplay, so show controls and let the visitor press play. -->
    <audio src="music/xVs0_Theme.mp3" controls loop>
        If you can read this, then your browser doesn't support audio.
    </audio>

    <!-- Page heading and instructions -->
    <p class="introText">GIF Gallery of Enemies from the hit video game:</p>
    <p class="info">Mouse over each enemy GIF to see enemy names.</p>
    <img class="titleImage" src="images/mmx2_logo.gif" alt="Mega Man X2 logo">

    <!-- Section 1: the eight Maverick bosses -->
    <p class="category">Mavericks:</p>

    <img class="gifMavs" title="Wheel Gator" alt="Wheel Gator" src="images/enemy_images/enemy_gifs/mavericks/Gifwheelg.gif">
    <img class="gifMavs" title="Flame Stag" alt="Flame Stag" src="images/enemy_images/enemy_gifs/mavericks/x2anifstag.gif">
    <img class="gifMavs" title="Bubble Crab" alt="Bubble Crab" src="images/enemy_images/enemy_gifs/mavericks/x2anibcrab.gif">
    <img class="gifMavs" title="Magna Centipede" alt="Magna Centipede" src="images/enemy_images/enemy_gifs/mavericks/x2animcentipede.gif">
    <img class="gifMavs" title="Morph Moth" alt="Morph Moth" src="images/enemy_images/enemy_gifs/mavericks/x2animmoth.gif">
    <img class="gifMavs" title="O Ostrich" alt="O Ostrich" src="images/enemy_images/enemy_gifs/mavericks/x2anioostrich.gif">
    <img class="gifMavs" title="Wire Sponge" alt="Wire Sponge" src="images/enemy_images/enemy_gifs/mavericks/x2aniwsponge.gif">
    <img class="gifMavs" title="Crystal Snail" alt="Crystal Snail" src="images/enemy_images/enemy_gifs/mavericks/x2csnail.gif">

    <!-- Section 2: the three X Hunters -->
    <p class="category">X Hunters:</p>

    <img class="xHunters" title="Agile" alt="Agile" src="images/enemy_images/enemy_gifs/xHunters/x2agile.gif">
    <img class="xHunters" title="Serges" alt="Serges" src="images/enemy_images/enemy_gifs/xHunters/x2serges.gif">
    <img class="xHunters" title="Violen" alt="Violen" src="images/enemy_images/enemy_gifs/xHunters/x2violen.gif">

    <!-- Section 3: the final boss -->
    <p class="category">Sigma:</p>

    <img class="sigma" title="Sigma" alt="Sigma" src="images/enemy_images/enemy_gifs/sigma/x2neosigma.gif">

</body>
</html>
